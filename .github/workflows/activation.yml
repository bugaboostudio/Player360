name: Acquire activation file

# Workflow manual usado UMA vez para ativar a licença Unity Personal no CI.
# Passo a passo:
#   1. Rode este workflow (aba Actions -> "Acquire activation file" -> Run workflow).
#   2. Baixe o artefato .alf gerado.
#   3. Acesse https://license.unity3d.com/manual, envie o .alf e baixe o .ulf.
#   4. Crie os secrets no repositório (Settings -> Secrets and variables -> Actions):
#      - UNITY_LICENSE  = conteúdo completo do arquivo .ulf
#      - UNITY_EMAIL    = e-mail da conta Unity
#      - UNITY_PASSWORD = senha da conta Unity
# Para licença Pro/Plus, ignore este workflow e use UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD.
on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request manual activation file 🔑
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.32f1

      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filename }}
          path: ${{ steps.getManualLicenseFile.outputs.filename }}

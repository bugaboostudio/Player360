name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancela execuções anteriores do mesmo branch/PR para não desperdiçar minutos
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Testes (EditMode) 🧪
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache da Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-android-
            Library-Android-

      # PlayMode fica de fora por enquanto: o Meta XR SDK não roda bem em batchmode headless.
      #
      # O Meta XR SDK não suporta o editor Linux como plataforma alvo: sem
      # -buildTarget Android, o MRUK falha com "#error Unsupported platform".
      # Por isso os testes rodam na imagem com módulo Android e com o alvo
      # Android ativo (UNITY_ANDROID definido), igual ao job de build.
      # -accept-apiupdate deixa o API Updater corrigir APIs renomeadas no
      # Unity 6 (ex.: PhysicMaterial -> PhysicsMaterial) em batchmode.
      - name: Rodar testes
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          customImage: unityci/editor:ubuntu-6000.0.32f1-android-3
          customParameters: -buildTarget Android -accept-apiupdate
          checkName: Resultados dos testes (EditMode)
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test results
          path: artifacts
          retention-days: 14

  build:
    name: Build ${{ matrix.targetPlatform }} 🎮
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - Android # Meta Quest (APK sideload)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0 # necessário para o versionamento semântico do unity-builder

      # Build Android com IL2CPP consome muito disco no runner padrão
      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false # o SDK Android do sistema não é usado (a imagem do GameCI traz o próprio), mas remover é lento; os demais itens já liberam o suficiente
          swap-storage: false

      - name: Cache da Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build do projeto
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          androidExportType: androidPackage
          versioning: Semantic
          customParameters: -accept-apiupdate

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BugaPlayer360-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 14
